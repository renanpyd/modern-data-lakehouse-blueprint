name: Enterprise AI Platform CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    services:
      # Provisiona uma instância real e isolada do Redis para dar suporte matemático aos testes no GitHub
      redis-cache:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout project source code
      uses: actions/checkout@v4

    - name: Set up Python Runtime Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Enterprise Core Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Deterministic FinOps Unit Testing Suite
      run: |
        pytest tests/unit/test_cache.py
      env:
        PYTHONPATH: .
        REDIS_HOST: localhost
